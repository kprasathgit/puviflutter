# https://github.com/firebase/firebase-tools

name: Deploy to Firebase Hosting on merge

on:
  push:
    branches:
      - main
  # workflow_dispatch:  # This enables the manual deployment

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      # Step 1: Checkout the repository
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Remove any preinstalled Flutter (optional but safe)
        run: rm -rf "$HOME/flutter"

      # Step 2: Set up Flutter
      - name: Set up Flutter
        uses: subosito/flutter-action@v2.18.0
        with:
          flutter-version: '3.32.7' # 👈 use latest version supporting injectManifest

      # Step 3: Install Flutter dependencies
      - name: Install Flutter dependencies
        run: flutter pub get

      # Step 4: Build Flutter web app
      - name: Build Flutter web app
        run: flutter build web --no-tree-shake-icons --pwa-strategy=injectManifest

      # Step 5: Deploy to Firebase Hosting
      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PUVIPURE }}
          channelId: live
          projectId: puvipure
