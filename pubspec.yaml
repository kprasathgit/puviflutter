name: puvi
description: "A new Flutter project."

# Prevent accidental publishing to pub.dev.
publish_to: 'none'

version: 2.0.0+1

environment:
  sdk: ^3.6.2

dependencies:
  cached_network_image: ^3.4.1
  collection: ^1.19.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  go_router: ^16.0.0
  google_fonts: ^6.2.1
  http: ^1.4.0
  provider: ^6.1.5
  shimmer: ^3.0.0
  url_strategy: ^0.3.0
  
dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  # Enable generation of localized Strings from arb files.
  generate: true

  assets:
    # Add assets from the images directory to the application.
    - assets/images/
